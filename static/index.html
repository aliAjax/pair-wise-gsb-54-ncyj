<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1040px; margin: auto; }
    button { padding: .5rem .85rem; cursor: pointer; margin: .15rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .6rem; }
    h2 { margin-top: 1.6rem; font-size: 1.1rem; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调 · 抢修编队台</h1>
  <p>最小演示页。一次编队把故障单、出海时段和用缆量收进同一航次；完整业务通过README中的JSON接口调用。</p>

  <h2>故障与回填</h2>
  <div class="row">
    <button data-path="/api/records?limit=20">加载故障单</button>
    <button data-path="/api/stats">状态统计</button>
    <button data-path="/api/migration">回填升级状态</button>
    <button data-method="POST" data-path="/api/admin/backfill">执行一批回填</button>
  </div>

  <h2>资源与占用</h2>
  <div class="row">
    <button data-path="/api/resources">船机与班组</button>
    <button data-path="/api/spare-batches">备缆批次</button>
    <button data-path="/api/allocations">当前占用</button>
    <button data-path="/api/schedule">建议时段版本</button>
  </div>

  <h2>抢修编队</h2>
  <div class="row">
    <button data-path="/api/formations">编队列表</button>
    <button data-method="POST" data-path="/api/schedule/rebuild">调整建议时段(未确认失效)</button>
    <button data-method="POST" data-path="/api/admin/recover">从完整编队恢复</button>
  </div>

  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo","Content-Type":"application/json"};
async function run(btn) {
  const options = {headers};
  if (btn.dataset.method === "POST") options.method = "POST";
  try {
    const response = await fetch(btn.dataset.path, options);
    const data = await response.json();
    document.getElementById("output").textContent = "HTTP " + response.status + "\n" + JSON.stringify(data, null, 2);
  } catch (err) {
    document.getElementById("output").textContent = String(err);
  }
}
document.querySelectorAll("button[data-path]").forEach(btn => btn.onclick = () => run(btn));
</script>
</body>
</html>
