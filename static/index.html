<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调 · 抢修编队台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1024px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
    h2 { margin-top: 2rem; font-size: 1.1rem; color: #2b5f8a; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调 · 抢修编队台</h1>
  <p>最小演示页。故障单、出海时段、用缆量与船/班组/备缆批次的编队编排通过README中的JSON接口调用。</p>
  <h2>故障单</h2>
  <div class="row"><button id="load">加载故障单</button><button id="stats">状态统计</button></div>
  <h2>抢修编队</h2>
  <div class="row">
    <button id="formations">编队列表</button>
    <button id="resources">资源台账与备缆余量</button>
    <button id="advisories">建议出海时段</button>
    <button id="backfill">回填进度</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("formations").onclick = () => show("/api/formations?limit=20");
document.getElementById("resources").onclick = () => show("/api/resources");
document.getElementById("advisories").onclick = () => show("/api/advisories");
document.getElementById("backfill").onclick = () => show("/api/backfill/status");
</script>
</body>
</html>
